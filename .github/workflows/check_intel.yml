name: Intel Fortran

# Controls when the action will run.
on:
  push:
    branches:
      - develop
      - release/*
      - master

  workflow_dispatch:
  workflow_call:
    inputs:
      json-fortran-version:
        description: "The version of the JSON-Fortran library to use."
        type: string
        required: false
        default: "8.4.0"
      pfunit-version:
        description: "The version of the pFUnit library to use."
        type: string
        required: false
        default: "v4.15.0"

jobs:
  Intel:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [ifx]
        precision: [sp, dp]
        backend: [cpu]
        include:
          - os: ubuntu-24.04
            setup-env: |
              wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
              sudo apt-get update -y
              sudo apt install -y intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp
              # Intel MPI is pinned: 2021.18 segfaults inside mpi_file_open_f08
              # for any MPI_File_open issued through the mpi_f08 bindings, which
              # every Neko read and write of a mesh, field or checkpoint uses.
              # 2021.17 and earlier are fine. Drop the pin once a later release
              # fixes it; m4/ax_mpif08.m4 makes the f08 bindings mandatory, so
              # there is no fallback to the legacy mpi module.
              sudo apt install -y intel-oneapi-mpi-2021.17 intel-oneapi-mpi-devel-2021.17
              source /opt/intel/oneapi/setvars.sh
              # setvars.sh walks the "latest" links, which the version specific
              # MPI package does not create, so point it at the pinned one.
              source /opt/intel/oneapi/mpi/2021.17/env/vars.sh
              sudo apt install -y autoconf automake autotools-dev libopenblas-dev make git m4 python3 python3-pip ca-certificates cmake
              INTEL_PATH=$(find /opt/intel/oneapi/compiler/ -name "${FC}" -type f | xargs dirname)
              export PATH=$INTEL_PATH:${PATH}
              printenv >> $GITHUB_ENV
              echo "nproc=$(nproc)" >> $GITHUB_OUTPUT
              echo "os-version=$(lsb_release -ds | tr " " -)" >> $GITHUB_OUTPUT

    env:
      CC: icx
      FC: ${{ matrix.compiler }}
      RP: ${{ matrix.precision }}
      NEKO_EXEC: ${{ github.workspace }}/install/bin/neko
      MAKENEKO_EXEC: ${{ github.workspace }}/install/bin/makeneko
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.backend }} - ${{ matrix.precision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup env.
        id: setup-env
        run: ${{ matrix.setup-env }}

      - name: Setup dependencies
        id: setup-deps
        env:
          PFUNIT_VERSION: ${{ inputs.pfunit-version }}
          JSON_FORTRAN_VERSION: ${{ inputs.json-fortran-version }}
        run: |
          if [ -z "$PFUNIT_VERSION" ]; then PFUNIT_VERSION="v4.15.0"; fi
          if [ -z "$JSON_FORTRAN_VERSION" ]; then JSON_FORTRAN_VERSION="8.3.0"; fi

          echo "pfunit-version=$PFUNIT_VERSION" >> $GITHUB_OUTPUT
          echo "json-fortran-version=$JSON_FORTRAN_VERSION" >> $GITHUB_OUTPUT

      - name: Setup - Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: "**/requirements-tests.txt"

      - name: Setup - Install Python dependencies
        run: |
          pip install -r .github/workflows/extra/requirements-tests.txt

      - name: Get pFUnit
        id: get-pfunit
        if: matrix.backend == 'cpu'
        uses: ./.github/actions/setup_pfunit
        with:
          version: ${{ steps.setup-deps.outputs.pfunit-version }}
          os: ${{ steps.setup-env.outputs.os-version }}
          compiler: ${{ matrix.compiler }}

      - name: Get JSON-Fortran
        id: get-json-fortran
        uses: ./.github/actions/setup_json-fortran
        with:
          version: ${{ steps.setup-deps.outputs.json-fortran-version }}
          os: ${{ steps.setup-env.outputs.os-version }}
          compiler: ${{ matrix.compiler }}

      - name: Build - Configure Neko
        env:
          PFUNIT_DIR: ${{ steps.get-pfunit.outputs.install-dir }}
        run: |
          mkdir ${{ github.workspace }}/install
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}:${{ github.workspace }}/install/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${{ github.workspace }}/install/lib" >> $GITHUB_ENV
          echo "${{ github.workspace }}/install/bin" >> $GITHUB_PATH
          ./regen.sh
          ./configure FC=${FC} CC=${CC} MPIFC=mpiifx \
            FCFLAGS="-O2 -stand f08 $(pkg-config --cflags json-fortran)" \
            --with-pfunit=$PFUNIT_DIR --enable-real=${RP} \
            --prefix=${{ github.workspace }}/install

      - name: Build - Build and install Neko
        run: make -j ${{ steps.setup-env.outputs.nproc }} install

      # ---------------------------------------------------------------------- #
      # Testing
      # ---------------------------------------------------------------------- #

      - name: Test - Integration tests
        run: |
          chmod +x $MAKENEKO_EXEC
          cd tests/integration
          pytest --timeout 300 --max_nprocs=2 --real_precision=${RP}
          cd ../..

      - name: Test - Check
        run: |
          make -j ${{ steps.setup-env.outputs.nproc }} check > tests/test-suite.log

      - name: Test - Archive test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test report - ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.backend }} - ${{ matrix.precision }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            tests/unit/test-suite.log
            tests/integration/logs
            tests/integration/**/*.csv
