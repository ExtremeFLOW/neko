name: Feature request
description: Suggest a new feature or improvement for Neko.
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Please provide a concise summary of the feature requested.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        What problem does this feature solve, or what use case does it enable?
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        If you have an idea of how the feature could be implemented or how it
        should behave, please describe it here.
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Please provide any extra details, references, or context relevant for
        the request.
    validations:
      required: false
