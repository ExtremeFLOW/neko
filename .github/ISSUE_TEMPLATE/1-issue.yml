name: Issue
description: Report a bug or problem in Neko.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Before opening it, please search the
        existing issues to avoid duplicates. For usage questions, please use
        [Discussions](https://github.com/ExtremeFLOW/neko/discussions) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Please provide a concise summary of the issue faced.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Neko configuration
        Please provide the Neko configuration used to reproduce the issue.

  - type: input
    id: version
    attributes:
      label: Neko version
      description: |
        If working on develop, specify the commit hash: `git rev-parse HEAD`.
        If using a release, specify the version: `git describe --tags`.
      placeholder: v1.0.0 or 62cd4b207a9
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Machine and compiler stack
      description: |
        The operating system or HPC machine, and the compilers and relevant
        libraries used, including their versions.
      placeholder: |
        Machine: Ubuntu 24.04, LUMI-G, Dardel, ...
        Compilers: gfortran 13.2, OpenMPI 4.1.6, CUDA 12.4, ...
    validations:
      required: true

  - type: textarea
    id: configure
    attributes:
      label: Configure
      description: The flags passed to `configure`.
      placeholder: ./configure --enable-cuda --with-json-fortran=...
      render: shell

  - type: textarea
    id: job-information
    attributes:
      label: Job Information
      description: Paste the "Job Information" block from the Neko log output.
      placeholder: |
        -------Job Information--------
        Paste job information block here.
      render: text

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide the steps to reproduce the issue. If possible, please
        provide a minimal code snippet or case file that reproduces the issue.
        Files can be attached by dragging them into this field.

  - type: markdown
    attributes:
      value: |
        ## Additional Details
        Please provide any extra details, screenshots, or context relevant for
        investigation.

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Please provide any extra details, screenshots, or context relevant for
        investigation.
