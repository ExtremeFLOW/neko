name: Feature request
description: Suggest a new feature or improvement for Neko.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Before opening the request,
        please search the existing issues to see if it has already been
        proposed. For general questions, please use
        [Discussions](https://github.com/ExtremeFLOW/neko/discussions) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Please provide a concise summary of the feature requested.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        What problem does this feature solve, or what use case does it enable?

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        If you have an idea of how the feature could be implemented or how it
        should behave, please describe it here.

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Please provide any extra details, references, or context relevant for
        the request.
